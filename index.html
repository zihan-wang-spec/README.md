<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>升学雷达 · 申请者自评测</title>
  <style>
    /* ============================================================
       第 1 步：能从头答到尾的骨架
       - 开始页 / 一题一屏占位选择题 / 结果占位页
       - 深色卡片 + 顶部彩色渐变进度条；选项大按钮悬停浮起
       ============================================================ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.22) 0%, transparent 36%),
        radial-gradient(circle at 88% 8%, rgba(244, 114, 182, 0.2) 0%, transparent 32%),
        radial-gradient(circle at 70% 92%, rgba(250, 204, 21, 0.12) 0%, transparent 28%),
        #0b1020;
    }

    .app {
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
    }

    .screen.active {
      display: flex;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 深色卡片：开始页 / 答题页 / 结果页共用 */
    .card {
      background: #161b2e;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    .welcome-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .hero-emoji {
      font-size: 56px;
      line-height: 1;
      text-align: center;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.3;
      text-align: center;
      margin-bottom: 12px;
    }

    .hero-desc {
      font-size: 16px;
      line-height: 1.7;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 28px;
    }

    .start-btn,
    .option-btn,
    .retry-btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      border-radius: 18px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .start-btn {
      width: 100%;
      padding: 18px 20px;
      font-size: 18px;
      color: #0b1020;
      background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 50%, #fb7185 100%);
      box-shadow: 0 10px 24px rgba(167, 139, 250, 0.35);
    }

    .start-btn:hover,
    .retry-btn:hover {
      transform: translateY(-3px);
    }

    .start-btn:active,
    .option-btn:active,
    .retry-btn:active {
      transform: scale(0.97);
    }

    /* ---------- 答题页：顶部彩色渐变进度条 ---------- */
    .quiz-top {
      margin-bottom: 16px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .progress-label {
      font-size: 14px;
      color: #94a3b8;
    }

    .progress-count {
      font-size: 14px;
      color: #7dd3fc;
    }

    .progress-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 12.5%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #fb7185, #facc15);
      transition: width 0.28s ease;
    }

    .question-text {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      margin-bottom: 22px;
    }

    /* 选项：一排圆角大按钮，悬停浮起、边框变亮 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: center;
      padding: 18px 16px;
      font-size: 17px;
      color: #f1f5f9;
      background: #1e2540;
      border: 2px solid #334155;
      box-shadow: 0 6px 0 #0b1020;
    }

    .option-btn:hover {
      transform: translateY(-4px);
      border-color: #67e8f9;
      background: #243056;
      box-shadow: 0 10px 0 #0b1020, 0 12px 20px rgba(103, 232, 249, 0.18);
    }

    /* ---------- 结果页：上半雷达图、下半类型名 ---------- */
    .radar-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 8px;
    }

    #radarCanvas {
      width: 280px;
      height: 280px;
      display: block;
    }

    .result-placeholder {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      margin: 4px 0 22px;
    }

    .retry-btn {
      width: 100%;
      padding: 16px 18px;
      font-size: 16px;
      color: #0b1020;
      background: #facc15;
      box-shadow: 0 8px 0 #ca8a04;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 开始页 -->
    <section id="screen-welcome" class="screen active">
      <div class="card">
        <div class="welcome-badge">升学雷达</div>
        <div class="hero-emoji">🧭</div>
        <h1 class="hero-title">申请者自评测</h1>
        <p class="hero-desc">答一组轻松选择题，看看你是哪种申请者。大约 3 分钟，给画像，不给分数。</p>
        <button type="button" class="start-btn" id="startBtn">开始测试</button>
      </div>
    </section>

    <!-- 答题页：一次一道选择题 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <div class="progress-meta">
          <span class="progress-label">慢慢选，没有对错</span>
          <span class="progress-count" id="progressText">第 1 / 3 题</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="card">
        <h2 class="question-text" id="questionText">题目1</h2>
        <div class="options" id="optionsBox"></div>
      </div>
    </section>

    <!-- 结果页：上半能力雷达图，下半类型名 -->
    <section id="screen-result" class="screen">
      <div class="card">
        <div class="radar-wrap">
          <canvas id="radarCanvas" width="280" height="280"></canvas>
        </div>
        <p class="result-placeholder" id="resultText">你更像：—</p>
        <button type="button" class="retry-btn" id="retryBtn">再测一次</button>
      </div>
    </section>
  </div>

  <script>
    /* ============================================================
       【以后改这里】申请者类型
       - id：给选项 scores 用（不要用中文）
       - name：结果显示给同学看的名字
       ============================================================ */
    const TYPES = [
      { id: "academic", name: "学术钻研型" },
      { id: "balanced", name: "全面均衡型" },
      { id: "talent", name: "特长鲜明型" },
      { id: "explorer", name: "探索好奇型" }
    ];

    /* ============================================================
       【改雷达图维度名字看这里】
       - id：给选项 radar 用
       - name：五个角上显示的字
       ============================================================ */
    const DIMENSIONS = [
      { id: "academic", name: "学术" },
      { id: "activity", name: "活动" },
      { id: "clarity", name: "兴趣明确度" },
      { id: "explore", name: "探索欲" },
      { id: "plan", name: "规划度" }
    ];

    /* ============================================================
       【以后在这里加题】每道题：text + options
       scores：给申请者类型加分（key 对 TYPES 的 id）
       radar：给雷达图维度加分（key 对 DIMENSIONS 的 id）
       ============================================================ */
    const QUESTIONS = [
      {
        text: "周末终于空下来了，你更想怎么过？",
        options: [
          { label: "把这周没弄懂的题再啃一遍", scores: { academic: 2 }, radar: { academic: 2, plan: 1, clarity: 1 } },
          { label: "社团、运动、作业都沾一点", scores: { balanced: 2 }, radar: { activity: 2, explore: 1 } },
          { label: "去练我最拿手的那件事", scores: { talent: 2 }, radar: { activity: 1, clarity: 2, plan: 1 } }
        ]
      },
      {
        text: "遇到一道怎么也解不开的难题，你通常会？",
        options: [
          { label: "不弄明白不罢休，继续往下钻", scores: { academic: 2 }, radar: { academic: 2, plan: 1 } },
          { label: "先换个方向试试，说不定有新发现", scores: { explorer: 2 }, radar: { explore: 2, academic: 1 } },
          { label: "用我已经很熟的方法先拿下能拿的分", scores: { talent: 1, balanced: 1 }, radar: { plan: 2, clarity: 1 } }
        ]
      },
      {
        text: "别人问起「你是怎样的人」，你最先想到的是？",
        options: [
          { label: "爱学习、爱把一件事搞清楚", scores: { academic: 2 }, radar: { academic: 2, plan: 1, clarity: 1 } },
          { label: "什么都想试试，还没完全定下来", scores: { explorer: 2 }, radar: { explore: 2, activity: 1 } },
          { label: "学习、活动都还行，比较均衡", scores: { balanced: 2 }, radar: { academic: 1, activity: 1, plan: 1, clarity: 1 } }
        ]
      }
    ];

    const TOTAL = QUESTIONS.length;

    const welcomeScreen = document.getElementById("screen-welcome");
    const quizScreen = document.getElementById("screen-quiz");
    const resultScreen = document.getElementById("screen-result");
    const questionText = document.getElementById("questionText");
    const optionsBox = document.getElementById("optionsBox");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const resultText = document.getElementById("resultText");

    let currentIndex = 0;
    let totals = {};
    let radarTotals = {};

    function showScreen(screen) {
      welcomeScreen.classList.remove("active");
      quizScreen.classList.remove("active");
      resultScreen.classList.remove("active");
      screen.classList.add("active");
    }

    /* 类型分、雷达维度分都清成 0 */
    function resetTotals() {
      totals = {};
      radarTotals = {};
      TYPES.forEach(function (type) {
        totals[type.id] = 0;
      });
      DIMENSIONS.forEach(function (dim) {
        radarTotals[dim.id] = 0;
      });
    }

    /* 把这个选项的 scores 加进类型总分 */
    function addScores(scores) {
      Object.keys(scores || {}).forEach(function (typeId) {
        totals[typeId] = (totals[typeId] || 0) + scores[typeId];
      });
    }

    /* 把这个选项的 radar 加进维度总分 */
    function addRadar(radar) {
      Object.keys(radar || {}).forEach(function (dimId) {
        radarTotals[dimId] = (radarTotals[dimId] || 0) + radar[dimId];
      });
    }

    /* 得分最高的就是类型；并列时取 TYPES 里排在前面的 */
    function pickType() {
      let best = TYPES[0];
      TYPES.forEach(function (type) {
        if (totals[type.id] > totals[best.id]) {
          best = type;
        }
      });
      return best;
    }

    /* 每维：各题选项里该维的最高分之和，用来把原始分换成 0–100 */
    function maxRadarPossible() {
      const max = {};
      DIMENSIONS.forEach(function (dim) {
        max[dim.id] = 0;
      });
      QUESTIONS.forEach(function (q) {
        const qMax = {};
        DIMENSIONS.forEach(function (dim) {
          qMax[dim.id] = 0;
        });
        q.options.forEach(function (opt) {
          const radar = opt.radar || {};
          DIMENSIONS.forEach(function (dim) {
            qMax[dim.id] = Math.max(qMax[dim.id], radar[dim.id] || 0);
          });
        });
        DIMENSIONS.forEach(function (dim) {
          max[dim.id] += qMax[dim.id];
        });
      });
      return max;
    }

    function toPercentScores() {
      const max = maxRadarPossible();
      const percents = {};
      DIMENSIONS.forEach(function (dim) {
        const raw = radarTotals[dim.id] || 0;
        const cap = max[dim.id] || 1;
        percents[dim.id] = Math.round(Math.min(100, (raw / cap) * 100));
      });
      return percents;
    }

    function radarPoint(index, radius, cx, cy, count) {
      const angle = -Math.PI / 2 + (Math.PI * 2 * index) / count;
      return {
        x: cx + Math.cos(angle) * radius,
        y: cy + Math.sin(angle) * radius,
        angle: angle
      };
    }

    function tracePolygon(ctx, points) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
    }

    /* 手绘雷达图：淡色网格 + 蓝紫半透明渐变填充 + 角上维度名 */
    function drawRadar(percentScores) {
      const canvas = document.getElementById("radarCanvas");
      const cssSize = 280;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = cssSize * dpr;
      canvas.height = cssSize * dpr;
      canvas.style.width = cssSize + "px";
      canvas.style.height = cssSize + "px";

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssSize, cssSize);

      const count = DIMENSIONS.length;
      const cx = cssSize / 2;
      const cy = cssSize / 2 + 6;
      const maxR = 78;
      const levels = 4;

      for (let level = levels; level >= 1; level--) {
        const ring = [];
        for (let i = 0; i < count; i++) {
          ring.push(radarPoint(i, maxR * (level / levels), cx, cy, count));
        }
        tracePolygon(ctx, ring);
        ctx.strokeStyle = "rgba(148, 163, 184, 0.22)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      for (let i = 0; i < count; i++) {
        const tip = radarPoint(i, maxR, cx, cy, count);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(tip.x, tip.y);
        ctx.strokeStyle = "rgba(148, 163, 184, 0.2)";
        ctx.stroke();
      }

      const dataPoints = [];
      for (let i = 0; i < count; i++) {
        const value = (percentScores[DIMENSIONS[i].id] || 0) / 100;
        dataPoints.push(radarPoint(i, maxR * value, cx, cy, count));
      }
      tracePolygon(ctx, dataPoints);
      const grad = ctx.createLinearGradient(cx - maxR, cy - maxR, cx + maxR, cy + maxR);
      grad.addColorStop(0, "rgba(56, 189, 248, 0.42)");
      grad.addColorStop(1, "rgba(167, 139, 250, 0.42)");
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = "rgba(125, 211, 252, 0.95)";
      ctx.lineWidth = 2;
      ctx.stroke();

      dataPoints.forEach(function (pt) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#e0f2fe";
        ctx.fill();
      });

      ctx.font = "700 12px PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillStyle = "#cbd5e1";
      DIMENSIONS.forEach(function (dim, i) {
        const labelPt = radarPoint(i, maxR + 20, cx, cy, count);
        const cos = Math.cos(labelPt.angle);
        const sin = Math.sin(labelPt.angle);
        /* 左右两侧用居中，避免「兴趣明确度」画出画布 */
        ctx.textAlign = "center";
        ctx.textBaseline = sin > 0.45 ? "top" : sin < -0.45 ? "bottom" : "middle";
        let x = labelPt.x;
        if (cos > 0.4) x += 6;
        if (cos < -0.4) x -= 6;
        ctx.fillText(dim.name, x, labelPt.y);
      });
    }

    /* 渲染当前题：题干 + 带加分规则的选项按钮 */
    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      questionText.textContent = q.text;
      progressText.textContent = "第 " + (currentIndex + 1) + " / " + TOTAL + " 题";
      progressFill.style.width = ((currentIndex + 1) / TOTAL * 100) + "%";

      optionsBox.innerHTML = "";
      q.options.forEach(function (option) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = option.label;
        btn.addEventListener("click", function () {
          goNext(option);
        });
        optionsBox.appendChild(btn);
      });
    }

    function goNext(option) {
      addScores(option.scores);
      addRadar(option.radar);
      if (currentIndex < TOTAL - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        const type = pickType();
        resultText.textContent = "你更像：" + type.name;
        showScreen(resultScreen);
        drawRadar(toPercentScores());
      }
    }

    document.getElementById("startBtn").addEventListener("click", function () {
      currentIndex = 0;
      resetTotals();
      showScreen(quizScreen);
      renderQuestion();
    });

    document.getElementById("retryBtn").addEventListener("click", function () {
      currentIndex = 0;
      resetTotals();
      showScreen(welcomeScreen);
    });
  </script>
</body>
</html>

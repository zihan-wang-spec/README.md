<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAPS · 申请者自评测</title>
  <meta name="description" content="GAPS 申请者自评测：16 道轻松选择题，看清你是哪种申请者。给画像，不给分数。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <section id="screen-welcome" class="screen active">
      <div class="card">
        <div class="welcome-badge">GAPS</div>
        <div class="hero-emoji">🧭</div>
        <h1 class="hero-title">申请者自评测</h1>
        <p class="hero-desc">16 道轻松选择题，看看你更像哪种申请者。</p>
        <button type="button" class="start-btn" id="startBtn">开始测试</button>
      </div>
    </section>

    <section id="screen-profile" class="screen">
      <div class="card profile-card">
        <div class="welcome-badge">先认识一下你</div>
        <h2 class="profile-title">测评前小问卷</h2>
        <p class="profile-desc">随便填，没有对错，帮助画像更贴近你。</p>

        <div class="profile-field">
          <p class="tag-heading">1. 性别</p>
          <div class="choice-row" id="genderChoices" role="group" aria-label="性别">
            <button type="button" class="choice-chip" data-value="男生">男生</button>
            <button type="button" class="choice-chip" data-value="女生">女生</button>
            <button type="button" class="choice-chip" data-value="不愿透露">不愿透露</button>
          </div>
        </div>

        <div class="profile-field">
          <p class="tag-heading">2. 年级</p>
          <div class="choice-row" id="gradeChoices" role="group" aria-label="年级">
            <button type="button" class="choice-chip" data-value="初二">初二</button>
            <button type="button" class="choice-chip" data-value="初三">初三</button>
            <button type="button" class="choice-chip" data-value="高一">高一</button>
            <button type="button" class="choice-chip" data-value="高二">高二</button>
            <button type="button" class="choice-chip" data-value="高三">高三</button>
          </div>
        </div>

        <div class="profile-field">
          <p class="tag-heading">3. 兴趣爱好，或擅长做的事</p>
          <textarea id="interestInput" class="profile-textarea" rows="3" maxlength="200" placeholder="例如：篮球、画画、写代码、组织活动……"></textarea>
        </div>

        <p class="profile-hint" id="profileHint" hidden>请先完成上面三项再继续～</p>
        <button type="button" class="start-btn" id="profileNextBtn">开始答题</button>
      </div>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <div class="progress-meta">
          <button type="button" class="prev-btn" id="prevBtn">上一题</button>
          <span class="progress-count" id="progressText">第 1 / 16 题</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-label">慢慢选，没有对错</p>
      </div>
      <div class="card">
        <h2 class="question-text" id="questionText">题目</h2>
        <div class="options" id="optionsBox"></div>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="card result-card">
        <div class="badge-wrap">
          <div class="type-badge" id="typeBadge">
            <div class="badge-icon-wrap">
              <img id="badgeIcon" class="badge-icon" alt="" width="64" height="64">
            </div>
            <div class="badge-name" id="badgeName"></div>
          </div>
        </div>
        <div class="radar-wrap">
          <canvas id="radarCanvas" width="280" height="280"></canvas>
        </div>
        <div class="tag-block">
          <p class="tag-heading">强项</p>
          <div class="tag-row" id="strengthTags"></div>
        </div>
        <div class="tag-block">
          <p class="tag-heading">最该补的一块</p>
          <div class="tag-row" id="gapTags"></div>
        </div>
        <div class="advice-block">
          <p class="tag-heading">适合方向</p>
          <p class="advice-text" id="directionText"></p>
        </div>
        <div class="advice-block advice-gap">
          <p class="tag-heading">可以这样补</p>
          <p class="advice-text" id="gapAdviceText"></p>
        </div>
        <p class="result-blurb" id="resultBlurb"></p>
        <div class="share-row">
          <button type="button" class="ghost-btn" id="copyBtn">复制画像</button>
          <button type="button" class="ghost-btn" id="saveBtn">保存卡片</button>
        </div>
        <button type="button" class="retry-btn" id="retryBtn">再测一次</button>
      </div>
    </section>
  </div>

  <!-- 备案号拿到后，把 XXXXXXXX 换成真实号 -->
  <footer class="site-footer">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备XXXXXXXX号-1</a>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
